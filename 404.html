<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | Influqo</title>
  <meta name="description" content="The requested page could not be located on Influqo.">
  <link rel="icon" type="image/svg+xml" href="assets/images/branding/favicon.svg">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('influqo_theme_v1');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = saved || (prefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch(e) {}
    })();
  </script>
</head>
<body>

  <!-- Site Header -->
  <header class="site-header" role="banner">
    <div class="container header-inner">
      <div class="header-left">
        <a href="index.html" class="brand-logo" aria-label="Influqo Homepage">
          <img src="assets/images/branding/influqo-logo.png" alt="Influqo" class="logo-light-mode" width="160" height="46">
          <img src="assets/images/branding/influqo-logo-light-trimmed.png" alt="Influqo" class="logo-dark-mode" width="160" height="46">
        </a>
      </div>

      <nav class="desktop-nav" aria-label="Main Navigation">
        <a href="index.html" class="nav-link">Home</a>
        <a href="shop.html" class="nav-link">Shop</a>
        <a href="shop.html?deal=true" class="nav-link">Deals</a>
        <a href="contact.html" class="nav-link">Contact</a>
      </nav>

      <div class="header-actions">
        <button type="button" class="icon-btn theme-toggle-btn" aria-label="Switch to dark mode" title="Switch theme">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>
        <a href="cart.html" class="icon-btn" aria-label="Shopping Cart" title="Shopping Cart">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
          <span class="badge-counter cart-count-badge">0</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="site-main section-spacing" id="mainContent">
    <div class="container" style="max-width: 620px; text-align: center; padding-top: 4rem; padding-bottom: 4rem;">

      <div style="font-size: 5.5rem; font-weight: 900; line-height: 1; color: var(--brand-navy); margin-bottom: 1rem;">
        404
      </div>

      <h1 style="font-size: 2rem; font-weight: 800; margin-bottom: 1rem;">Page Not Found</h1>

      <p style="font-size: 1.05rem; color: var(--text-muted); line-height: 1.6; margin-bottom: 2rem;">
        The page, category, or document you were looking for doesn't exist or may have been relocated.
      </p>

      <div style="display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center;">
        <a href="index.html" class="btn btn-primary">Return to Homepage</a>
        <a href="shop.html" class="btn btn-secondary">Explore Shop Catalogue</a>
      </div>

    </div>
  </main>

  <!-- Site Footer -->
  <footer class="site-footer" role="contentinfo">
    <div class="container footer-bottom" style="border-top: none; padding-top: 0;">
      <span>&copy; 2026 Influqo Ltd. Client presentation prototype.</span>
      <span>Sample products and prices • No real purchases or payments.</span>
    </div>
  </footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/products.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/shared.js"></script>
</body>
</html>
